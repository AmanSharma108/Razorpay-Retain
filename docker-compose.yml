services:
  # -------------------------------------------------------------
  # Backend API Service (FastAPI + Python)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: razorpay-retain-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ENABLE_DOCS=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/revenue_recovery.db
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_XXXXXXXXXXXXXX}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-XXXXXXXXXXXXXX}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - PUBLIC_WEBHOOK_URL=${PUBLIC_WEBHOOK_URL:-}
      - FRONTEND_URL=http://localhost
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:3000
      - RATE_LIMIT_PER_MINUTE=120
      - POLLING_INTERVAL_SECONDS=20
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------
  # Frontend UI Service (React 19 + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: razorpay-retain-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  backend_data:
    driver: local
